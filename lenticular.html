<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenticular Card</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9e6df;--fg:#222;--btn:#222;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--btn:#eee;--btnfg:#111}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--btn:#eee;--btnfg:#111}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;touch-action:none;user-select:none;-webkit-user-select:none}
#card{width:min(88vw,360px);aspect-ratio:720/972;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);display:block}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:99px;padding:12px 22px;font-size:16px}
#s{font-size:14px;opacity:.7;text-align:center;max-width:300px;min-height:2.4em}
</style></head><body>
<canvas id="card" width="720" height="972"></canvas>
<button id="b">Enable tilt</button>
<div id="s">Tilt your phone left and right, or drag the card.</div>
<script>
const W=720,H=972,L=8,cv=document.getElementById('card'),ctx=cv.getContext('2d');
const mk=d=>{const c=document.createElement('canvas');c.width=W;c.height=H;d(c.getContext('2d'));return c};
function mountains(g,cols){
  const layers=[[640,[0,700,160,520,300,640,470,470,620,620,720,560]],[780,[0,820,200,680,380,780,560,650,720,740]]];
  layers.forEach((l,i)=>{g.fillStyle=cols[i];g.beginPath();g.moveTo(0,H);const p=l[1];
    for(let k=0;k<p.length;k+=2)g.lineTo(p[k],p[k+1]+(i?60:0));
    g.lineTo(W,H);g.closePath();g.fill()});
}
function title(g,t,c){g.fillStyle=c;g.font='bold 84px system-ui,sans-serif';g.textAlign='center';g.fillText(t,W/2,H-90)}
const A=mk(g=>{
  let s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#3aa0ff');s.addColorStop(.6,'#ffc36b');s.addColorStop(1,'#ff8a5c');
  g.fillStyle=s;g.fillRect(0,0,W,H);
  let r=g.createRadialGradient(500,300,40,500,300,300);r.addColorStop(0,'rgba(255,240,150,.9)');r.addColorStop(1,'rgba(255,240,150,0)');
  g.fillStyle=r;g.fillRect(0,0,W,H);
  g.fillStyle='#fff4a8';g.beginPath();g.arc(500,300,100,0,7);g.fill();
  g.strokeStyle='#fff4a8';g.lineWidth=8;g.lineCap='round';
  for(let i=0;i<14;i++){const a=i/14*6.283;g.beginPath();g.moveTo(500+Math.cos(a)*125,300+Math.sin(a)*125);g.lineTo(500+Math.cos(a)*165,300+Math.sin(a)*165);g.stroke()}
  g.strokeStyle='#2b2b3a';g.lineWidth=6;[[150,200],[230,250],[100,290]].forEach(([x,y])=>{g.beginPath();g.moveTo(x-28,y);g.quadraticCurveTo(x-10,y-24,x,y);g.quadraticCurveTo(x+10,y-24,x+28,y);g.stroke()});
  mountains(g,['#c4573f','#7a2f3a']);title(g,'DAY','#fff');
});
const B=mk(g=>{
  let s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#05061a');s.addColorStop(.7,'#1b2060');s.addColorStop(1,'#3a2a70');
  g.fillStyle=s;g.fillRect(0,0,W,H);
  let q=7;const rnd=()=>(q=q*16807%2147483647)/2147483647;
  g.fillStyle='#fff';for(let i=0;i<110;i++){g.globalAlpha=.4+rnd()*.6;g.beginPath();g.arc(rnd()*W,rnd()*560,rnd()*2.6+.6,0,7);g.fill()}
  g.globalAlpha=1;
  let r=g.createRadialGradient(500,300,40,500,300,260);r.addColorStop(0,'rgba(190,210,255,.5)');r.addColorStop(1,'rgba(190,210,255,0)');
  g.fillStyle=r;g.fillRect(0,0,W,H);
  g.fillStyle='#e8efff';g.beginPath();g.arc(500,300,100,0,7);g.fill();
  g.fillStyle='#0c1038';g.beginPath();g.arc(540,280,92,0,7);g.fill();
  mountains(g,['#161a4a','#0b0d2c']);
  g.fillStyle='#ffd36b';g.fillRect(300,690,26,26);g.fillRect(250,730,22,22);
  title(g,'NIGHT','#cfd8ff');
});
// lens ridge shading overlay
const ridge=mk(g=>{for(let x=0;x<W;x+=L){const l=g.createLinearGradient(x,0,x+L,0);
  l.addColorStop(0,'rgba(0,0,0,.18)');l.addColorStop(.35,'rgba(255,255,255,.10)');l.addColorStop(.7,'rgba(0,0,0,0)');l.addColorStop(1,'rgba(0,0,0,.2)');
  g.fillStyle=l;g.fillRect(x,0,L,H)}});
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
let target=0,t=0,g0=null,userActive=false,sensor=false;
function draw(){
  ctx.drawImage(A,0,0);
  for(let x=0;x<W;x+=L){
    const tl=t+(x/W-.5)*.6, f=sm(-.3,.3,tl), bw=f*L;
    if(bw>.05)ctx.drawImage(B,x,0,bw,H,x,0,bw,H);
  }
  ctx.drawImage(ridge,0,0);
  // moving glare band
  const gx=W*(.5+t*.7);const gr=ctx.createLinearGradient(gx-160,0,gx+160,H*.4);
  gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.22)');gr.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
}
function loop(ts){
  if(!userActive)target=Math.sin(ts/1100)*.9;
  t+=(target-t)*.18;draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// sensor
const S=document.getElementById('s'),iOS=/iP(hone|ad|od)/.test(navigator.userAgent);
const cl=v=>Math.max(-1,Math.min(1,v));
let oriOK=false,lastDbg=0;
function dbg(m){const n=Date.now();if(n-lastDbg>300){S.textContent=m;lastDbg=n}}
function onOri(e){
  if(e.gamma==null)return;oriOK=sensor=userActive=true;
  if(g0===null)g0=e.gamma;
  target=cl((e.gamma-g0)/18);dbg('Sensor live (gyro) · tilt '+e.gamma.toFixed(0)+'°');
}
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(oriOK||!a||a.x==null)return;
  sensor=userActive=true;const x=iOS?a.x:-a.x;
  if(g0===null)g0=x;target=cl((x-g0)/3.5);dbg('Sensor live (accelerometer) · x '+x.toFixed(1));
}
document.getElementById('b').onclick=async()=>{
  try{
    for(const C of [window.DeviceOrientationEvent,window.DeviceMotionEvent])
      if(C&&C.requestPermission){const r=await C.requestPermission();
        if(r!=='granted'){S.textContent='Motion permission denied. Check Settings > Safari > Motion & Orientation Access, or drag the card.';return}}
  }catch(e){S.textContent='Permission error: '+e.message}
  g0=null;
  addEventListener('deviceorientation',onOri);
  addEventListener('deviceorientationabsolute',onOri);
  addEventListener('devicemotion',onMotion);
  let ev=0,serr='';
  ['deviceorientation','devicemotion'].forEach(n=>addEventListener(n,()=>ev++));
  try{if('Accelerometer' in window){
    const ac=new Accelerometer({frequency:30});
    ac.addEventListener('reading',()=>{ev++;if(oriOK)return;sensor=userActive=true;const x=-ac.x;
      if(g0===null)g0=x;target=cl((x-g0)/3.5);dbg('Sensor live (Generic Sensor) · x '+ac.x.toFixed(1))});
    ac.addEventListener('error',e=>{serr=e.error&&e.error.name});ac.start();}}catch(e){serr=e.name}
  S.textContent='Waiting for sensor data…';
  setTimeout(()=>{if(!sensor)S.textContent='No sensor data. https: '+isSecureContext+' · framed: '+(top!==self)+' · events: '+ev+(serr?' · error: '+serr:'')+'. Needs https, a full tab (not in-app), and Site settings > Motion sensors = Allowed. Or drag the card.'},2500);
};
// drag / tap fallback
let dx=null;
cv.addEventListener('pointerdown',e=>{dx=e.clientX;g0=null;if(sensor)return;userActive=true});
addEventListener('pointermove',e=>{if(dx===null||sensor)return;target=Math.max(-1,Math.min(1,(e.clientX-dx)/120+target*0));
  dx=dx; target=Math.max(-1,Math.min(1,(e.clientX-cv.getBoundingClientRect().left)/cv.clientWidth*2-1))});
addEventListener('pointerup',()=>{dx=null});
</script></body></html>
