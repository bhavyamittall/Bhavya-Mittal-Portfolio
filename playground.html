<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground &mdash; Bhavya Mittal</title>
  <meta name="description" content="Playground — a visual canvas by Bhavya Mittal." />
  <meta name="author" content="Bhavya Mittal" />
  <link rel="icon" type="image/svg+xml" href="assets/images/Logos/Favicon_ylckj8.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F5;
      --fg: #3a3a3a;
      --muted: #9a9a9a;
      --border: #e8e5e0;
      --blue: #2C8EFF;
      --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --shadow-border: 0px 0px 0px 1px rgba(0,0,0,0.06), 0px 1px 2px -1px rgba(0,0,0,0.06), 0px 2px 4px 0px rgba(0,0,0,0.04);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
      user-select: none;
    }

    @media (min-width: 769px) {
      html, body { overflow: hidden; }
    }

    @media (max-width: 768px) {
      html, body {
        overflow: auto;
        height: auto;
        cursor: auto;
        user-select: auto;
      }
    }

    /* ── Canvas ── */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      perspective: 920px;
      perspective-origin: 50% 52%;
    }

    #board {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-style: preserve-3d;
    }

    /* ── Image cards ── */
    .img-card {
      position: absolute;
      background: #fff;
      box-shadow:
        0px 0px 0px 1px rgba(0,0,0,0.03),
        0px 1px 3px -1px rgba(0,0,0,0.05),
        0px 3px 8px -3px rgba(0,0,0,0.04);
      border-radius: 1px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
      cursor: default;
      will-change: transform;
      transform-style: preserve-3d;
    }
    .img-card:hover {
      box-shadow:
        0px 0px 0px 1px rgba(0,0,0,0.05),
        0px 2px 8px -3px rgba(0,0,0,0.08),
        0px 6px 16px -5px rgba(0,0,0,0.06);
      z-index: 650 !important;
    }
    .img-card img,
    .img-card video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .galaxy-dim {
      position: absolute;
      inset: 0;
      background: #fff;
      pointer-events: none;
      z-index: 2;
    }

    /* subtle image paper inset */
    .img-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 1px;
      outline: 1px solid rgba(0,0,0,0.07);
      outline-offset: -1px;
      pointer-events: none;
    }

    /* ── Fade-in animation ── */
    @keyframes fadeIn {
      from { opacity: 0; filter: blur(3px); }
      to   { opacity: 1; filter: blur(0); }
    }
    @keyframes ghostReveal {
      from {
        opacity: 0;
        filter: blur(4px);
        -webkit-mask-position: 0% 0%;
        mask-position: 0% 0%;
      }
      to {
        opacity: 1;
        filter: blur(0);
        -webkit-mask-position: 0% 100%;
        mask-position: 0% 100%;
      }
    }
    .img-card {
      opacity: 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 18%, rgba(0,0,0,0.08) 27%, rgba(0,0,0,0.45) 35%, rgba(0,0,0,0.78) 43%, #000 52%, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, transparent 18%, rgba(0,0,0,0.08) 27%, rgba(0,0,0,0.45) 35%, rgba(0,0,0,0.78) 43%, #000 52%, #000 100%);
      -webkit-mask-size: 100% 420%;
      mask-size: 100% 420%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: 0% 0%;
      mask-position: 0% 0%;
      animation: ghostReveal 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .img-card {
        opacity: 1;
        filter: none;
        -webkit-mask-image: none;
        mask-image: none;
        animation: none;
      }
    }

    /* ── Bottom-left nav ── */
    #nav {
      position: fixed;
      bottom: 56px;
      left: 72px;
      display: flex;
      gap: 20px;
      z-index: 200;
      pointer-events: all;
    }

    #nav a {
      font-family: var(--font);
      font-size: 1rem;
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 2px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition-property: text-decoration-color, color;
      transition-duration: 0.15s;
      transition-timing-function: ease;
    }
    #nav a:hover {
      text-decoration-color: var(--muted);
      color: var(--fg);
    }


    /* ── Centre text (lives on the board, pans with it) ── */
    #centre-text {
      position: absolute;
      z-index: 700;
      left: 72px;
      bottom: 132px;
      text-align: left;
      pointer-events: none;
      user-select: none;
      transform: none;
      width: 560px;
    }
    #centre-text h1 {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      color: var(--fg);
      line-height: 1.45;
      letter-spacing: 0;
      margin: 0;
      opacity: 0;
      animation: fadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }
    #centre-text p {
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 400;
      color: var(--fg);
      line-height: 1.45;
      letter-spacing: 0em;
      margin: 0;
      opacity: 0;
      animation: fadeIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
    }

    /* ── Lightbox overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.82);
      align-items: center;
      justify-content: center;
      animation: overlayIn 0.2s ease forwards;
    }
    #overlay.active { display: flex; }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #overlay-media {
      max-width: 88vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 1px;
      display: block;
      animation: mediaIn 0.25s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes mediaIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    #overlay-close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      z-index: 1001;
    }
    #overlay-close:hover { background: rgba(255,255,255,0.2); }
    #overlay-close svg { display: block; }
    .img-card { cursor: pointer; }

    /* ── Overlay mobile video sizing ── */
    @media (max-width: 768px) {
      #overlay-media { max-width: 96vw; max-height: 75vh; }
      #mobile-images img,
      #mobile-images video { cursor: pointer; }
    }
    @media (max-width: 768px) {

      /* hide the canvas board entirely */
      #canvas { display: none; }

      /* mobile wrapper */
      #mobile-layout {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 48px 24px 32px;
        gap: 0;
      }

      /* header: title + subtext */
      #mobile-header {
        margin-bottom: 36px;
      }
      #mobile-header h1 {
        font-family: 'Noto Serif', Georgia, serif;
        font-size: 1.3rem;
        font-weight: 400;
        color: var(--fg);
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      #mobile-header p {
        font-family: var(--font);
        font-size: 0.85rem;
        font-weight: 400;
        color: var(--muted);
        line-height: 1.65;
        margin: 0;
      }

      /* image stack */
      #mobile-images {
        display: flex;
        flex-direction: column;
        gap: 16px;
        flex: 1;
      }
      #mobile-images img,
      #mobile-images video {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 1px;
        box-shadow:
          0px 0px 0px 1px rgba(0,0,0,0.03),
          0px 1px 3px -1px rgba(0,0,0,0.05),
          0px 3px 8px -3px rgba(0,0,0,0.04);
        opacity: 0;
        animation: fadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* mobile nav at bottom */
      #mobile-nav {
        display: flex;
        gap: 20px;
        margin-top: 40px;
        flex-wrap: wrap;
      }
      #mobile-nav a {
        font-family: var(--font);
        font-size: 1rem;
        color: var(--muted);
        text-decoration: underline;
        text-decoration-color: transparent;
        text-underline-offset: 2px;
        transition: color 0.15s ease, text-decoration-color 0.15s ease;
      }
      #mobile-nav a:hover {
        color: var(--fg);
        text-decoration-color: var(--muted);
      }

      /* hide desktop nav on mobile */
      #nav { display: none; }
    }

    /* hide mobile layout on desktop */
    @media (min-width: 769px) {
      #mobile-layout { display: none; }
    }

  </style>
</head>
<body>

  <div id="canvas">
    <div id="board">
    </div>
    <!-- Centre text -->
    <div id="centre-text">
      <h1>Playground</h1>
      <p>Drafts, scraps, experiments, accidents.<br>Some of my favorite work lives here.</p>
    </div>
  </div>

  <!-- bottom-left nav, matching index.html cv-line-desktop -->
  <nav id="nav">
    <a href="https://drive.google.com/file/d/1ErbdDrQ5eRREuS20UU6Qw8vEYLGaI8XJ/view?usp=sharing" target="_blank">CV</a>
    <a href="https://www.behance.net/bhavyamittall" target="_blank">Behance</a>

  <!-- Lightbox overlay -->
  <div id="overlay">
    <button id="overlay-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L13 13M13 1L1 13" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <!-- media injected by JS -->
  </div>

  <!-- Mobile layout — linear scroll -->
  <div id="mobile-layout">
    <div id="mobile-header">
      <h1>Playground</h1>
      <p>Drafts, scraps, experiments, accidents.<br>Some of my favorite work lives here.</p>
    </div>
    <div id="mobile-images">
    </div>
    <nav id="mobile-nav">
      <a href="https://drive.google.com/file/d/1ErbdDrQ5eRREuS20UU6Qw8vEYLGaI8XJ/view?usp=sharing" target="_blank">CV</a>
      <a href="https://www.behance.net/bhavyamittall" target="_blank">Behance</a>
      <a href="https://www.linkedin.com/in/bhavyamittalll/" target="_blank">LinkedIn</a>
      <a href="index.html">Home</a>
    </nav>
  </div>

  <script>
    /* ─────────────────────────────────────────────
    /* ─────────────────────────────────────────────
       Real assets — video cards use <video>, others <img>
    ───────────────────────────────────────────── */
    var BASE = "https://raw.githubusercontent.com/bhavyamittall/Bhavya-Mittal-Portfolio/main/assets/images/Playground/";
    var imageSrcs = [
      { type: "video", src: BASE + "Hinge_feature.webm", w: 420, h: 315 },
      { type: "video", src: BASE + "Motion1.webm",       w: 420, h: 315 },
      { type: "video", src: BASE + "Motion2.webm",       w: 400, h: 300 },
      { type: "video", src: BASE + "Motion3.webm",       w: 420, h: 315 },
      { type: "img",   src: BASE + "Plan%20States.gif",          w: 400, h: 300 },
      { type: "img",   src: BASE + "Retail%20Dashboard.gif",     w: 420, h: 315 },
      { type: "img",   src: BASE + "SFC%20Connect.webp",         w: 400, h: 300 },
      { type: "img",   src: BASE + "Slide%204_3%20-%206.webp",   w: 420, h: 315 },
      { type: "img",   src: BASE + "Slide%204_3%20-%207.webp",   w: 400, h: 300 },
      { type: "img",   src: BASE + "Slide%204_3%20-%208.webp",   w: 420, h: 315 },
      { type: "img",   src: BASE + "Slide%204_3%20-%2010.webp",  w: 400, h: 300 },
    ];

    // ── Spoke layout — 11 unique positions, guaranteed no repeats, no overlap ──
    // Each card gets a unique angle (evenly divided + random rotation offset).
    // Cards alternate between inner and outer radius to stay close to centre.
    // Shuffle order once
    var order = imageSrcs.map(function(_, i) { return i; });
    for (var s = order.length - 1; s > 0; s--) {
      var jj = Math.floor(Math.random() * (s + 1));
      var tt = order[s]; order[s] = order[jj]; order[jj] = tt;
    }
    var shuffled = order.map(function(i) { return imageSrcs[i]; });

    var board = document.getElementById("board");
    var centreText = document.getElementById("centre-text");
    var galaxyCards = [];
    var CONFIG = {
      speed: 0.45,
      ease: 0.16,
      scaleEase: 0.25,
      scrollMultiplier: 0.9,
      scaleMin: 0.92,
      scaleMax: 1.08
    };
    var COMPOSITION = [
      { x: 22, y: -10, z: -80, speed: 0.62 },
      { x: 61, y: 10, z: 120, speed: 0.9 },
      { x: 88, y: 12, z: -55, speed: 0.7 },
      { x: 3, y: 36, z: 90, speed: 1.05 },
      { x: 38, y: 60, z: -40, speed: 0.78 },
      { x: 88, y: 64, z: 125, speed: 1 },
      { x: 73, y: 91, z: -70, speed: 0.66 },
      { x: 52, y: 39, z: 45, speed: 0.86 },
      { x: 16, y: 83, z: -95, speed: 0.58 },
      { x: 78, y: -14, z: -110, speed: 0.54 },
      { x: 99, y: 39, z: -85, speed: 0.68 }
    ];
    var SPEED_POOL = [0.55, 0.75, 1, 1.3, 1.6];

    function lerp(a, b, t) {
      return (1 - t) * a + t * b;
    }

    function buildParticles(n) {
      return Array.from({ length: n }, function(_, i) {
        var slot = COMPOSITION[i % COMPOSITION.length];
        var z = slot.z;
        var opacity = z < 0 ? Math.max(0.68, 1 + z / 520) : 1;

        return {
          x: slot.x,
          y: slot.y,
          speed: slot.speed || SPEED_POOL[i % SPEED_POOL.length],
          z: z,
          opacity: opacity
        };
      });
    }

    var particleDefs = buildParticles(shuffled.length);

    shuffled.forEach(function(img, i) {
      var card = document.createElement("div");
      card.className = "img-card";
      card.style.width  = Math.round(img.w * 0.84) + "px";
      card.style.height = Math.round(img.h * 0.84) + "px";
      card.style.animationDelay = (i * 55) + "ms";

      var el;
      if (img.type === "video") {
        el = document.createElement("video");
        el.autoplay = true;
        el.loop     = true;
        el.muted    = true;
        el.setAttribute("playsinline", "");
        el.draggable = false;
        var s1 = document.createElement("source");
        s1.src  = img.src;
        s1.type = img.src.endsWith(".mp4") ? "video/mp4" : "video/webm";
        el.appendChild(s1);
      } else {
        el = document.createElement("img");
        el.src      = img.src;
        el.alt      = "";
        el.draggable = false;
      }

      card.appendChild(el);
      var dim = document.createElement("span");
      dim.className = "galaxy-dim";
      card.appendChild(dim);
      board.appendChild(card);
      galaxyCards.push(card);

      // Click to expand
      card.addEventListener("click", function() { openOverlay(img.type, img.src); });
    });

    function ImageGalaxy(container, cards, defs) {
      this.container = container;
      this.cards = cards;
      this.defs = defs;
      this.nodes = [];
      this.scroll = { current: 0, target: 0, last: 0 };
      this.directionSign = 1;
      this.direction = "down";
      this.containerHeight = 0;
      this.containerOffsetHeight = 0;
      this.lastTime = 0;
      this.raf = 0;
      this.layout();
    }

    ImageGalaxy.prototype.layout = function() {
      var rect = this.container.getBoundingClientRect();
      var small = window.innerWidth < 700;
      var self = this;
      this.nodes = this.cards.map(function(card, i) {
        var d = self.defs[i];
        var dim = card.querySelector(".galaxy-dim");
        if (dim) dim.style.opacity = String(1 - d.opacity);

        var left = small ? (i % 4) * 25 + (d.x % 20) : d.x;
        card.style.left = left + "%";
        card.style.top = d.y + "%";
        card.style.zIndex = String(Math.round(d.z + 300));
        card.style.transform = "translate3d(-50%, 0px, 0) scale(1)";

        var box = card.getBoundingClientRect();
        return {
          el: card,
          speed: d.speed,
          z: d.z,
          extra: 0,
          height: box.height,
          top: box.top - rect.top,
          position: 0,
          currentScale: 1,
          isBefore: false,
          isAfter: false
        };
      });
      this.containerHeight = this.container.clientHeight;
      this.containerOffsetHeight = this.containerHeight * 0.1;
      this.scroll = { current: 0, target: 0, last: 0 };
    };

    ImageGalaxy.prototype.addScroll = function(velocity, direction) {
      var v = Math.max(-60, Math.min(60, velocity));
      this.scroll.target += v * CONFIG.scrollMultiplier;
      this.direction = direction > 0 ? "down" : "up";
      if (direction !== 0) this.directionSign = Math.sign(direction);
    };

    ImageGalaxy.prototype.update = function(dt) {
      this.scroll.target += CONFIG.speed * dt * this.directionSign;
      this.scroll.current = lerp(this.scroll.current, this.scroll.target, CONFIG.ease);
      this.direction = this.scroll.current < this.scroll.last ? "down" : "up";

      this.nodes.forEach(function(t) {
        t.position = -this.scroll.current * t.speed - t.extra;
        var bottom = t.position + t.top + t.height;
        t.isBefore = bottom < -this.containerOffsetHeight;
        t.isAfter = bottom > this.containerHeight + this.containerOffsetHeight;

        if (this.direction === "up" && t.isBefore) {
          t.extra = t.extra - this.containerHeight - this.containerOffsetHeight;
          t.isBefore = false;
          t.isAfter = false;
        }
        if (this.direction === "down" && t.isAfter) {
          t.extra = t.extra + this.containerHeight;
          t.isBefore = false;
          t.isAfter = false;
        }

        var top = t.position + t.top;
        var f = Math.max(0, Math.min(1, top / this.containerHeight));
        var targetScale = CONFIG.scaleMin + f * (CONFIG.scaleMax - CONFIG.scaleMin);
        t.currentScale = lerp(t.currentScale, targetScale, CONFIG.scaleEase);
        t.el.style.transform = "translate3d(-50%, " + t.position.toFixed(2) + "px, " + t.z + "px) scale(" + t.currentScale.toFixed(3) + ")";
      }, this);

      this.scroll.last = this.scroll.current;
    };

    ImageGalaxy.prototype.start = function() {
      var self = this;
      function tick(now) {
        var dt = self.lastTime ? Math.min(2, (now - self.lastTime) / 16.667) : 1;
        self.lastTime = now;
        self.update(dt);
        self.raf = requestAnimationFrame(tick);
      }
      this.raf = requestAnimationFrame(tick);
    };

    var galaxy = new ImageGalaxy(board, galaxyCards, particleDefs);
    galaxy.start();
    window.addEventListener("resize", function() { galaxy.layout(); });

    /* ─────────────────────────────────────────────
       Lightbox
    ───────────────────────────────────────────── */
    var overlay      = document.getElementById("overlay");
    var overlayClose = document.getElementById("overlay-close");
    var overlayMedia = null;

    function openOverlay(type, src) {
      // Clear previous media
      var old = overlay.querySelector(".overlay-media-el");
      if (old) old.remove();

      var el;
      if (type === "video") {
        el = document.createElement("video");
        el.autoplay = true;
        el.loop     = true;
        el.muted    = true;
        el.controls = true;
        el.setAttribute("playsinline", "");
        var s = document.createElement("source");
        s.src  = src;
        s.type = src.endsWith(".mp4") ? "video/mp4" : "video/webm";
        el.appendChild(s);
      } else {
        el = document.createElement("img");
        el.src = src;
        el.alt = "";
      }
      el.id        = "overlay-media";
      el.className = "overlay-media-el";
      overlay.appendChild(el);
      overlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeOverlay() {
      overlay.classList.remove("active");
      var old = overlay.querySelector(".overlay-media-el");
      if (old) old.remove();
      document.body.style.overflow = "";
    }

    overlayClose.addEventListener("click", closeOverlay);
    overlay.addEventListener("click", function(e) {
      if (e.target === overlay) closeOverlay();
    });
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeOverlay();
    });

    // ── Build mobile image list from same shuffled order ──
    var mobileContainer = document.getElementById("mobile-images");
    if (mobileContainer) {
      shuffled.forEach(function(img, i) {
        var el;
        if (img.type === "video") {
          el = document.createElement("video");
          el.autoplay = true;
          el.loop     = true;
          el.muted    = true;
          el.setAttribute("playsinline", "");
          var src = document.createElement("source");
          src.src  = img.src;
          src.type = img.src.endsWith(".mp4") ? "video/mp4" : "video/webm";
          el.appendChild(src);
        } else {
          el = document.createElement("img");
          el.src = img.src;
          el.alt = "";
        }
        el.style.animationDelay = (i * 55) + "ms";
        el.addEventListener("click", function() { openOverlay(img.type, img.src); });
        mobileContainer.appendChild(el);
      });
    }

    /* ─────────────────────────────────────────────
       Cursor-follow: board drifts toward a target
       offset driven by mouse position
    ───────────────────────────────────────────── */
    var lastTouchY = null;
    document.addEventListener("touchstart", function(e) {
      lastTouchY = e.touches[0] ? e.touches[0].clientY : null;
    }, { passive: true });

    document.addEventListener("touchmove", function(e) {
      if (lastTouchY === null || !e.touches[0]) return;
      var nextY = e.touches[0].clientY;
      var delta = lastTouchY - nextY;
      galaxy.addScroll(delta, delta);
      lastTouchY = nextY;
    }, { passive: true });

    /* ── Scroll: do nothing (no zoom) ── */
    document.addEventListener("wheel", function(e) {
      e.preventDefault();
      galaxy.addScroll(e.deltaY, e.deltaY);
    }, { passive: false });
  </script>

</body>
</html>
